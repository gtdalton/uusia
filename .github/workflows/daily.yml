name: Daily Script

on:
  schedule:
    - cron: "0 4 * * *"  # runs every day at 8am UTC

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          SPYDUS_PASSWORD: ${{ secrets.SPYDUS_PASSWORD }}
          SPYDUS_USERNAME: ${{ secrets.SPYDUS_USERNAME }}
        run: python main.py

      - name: Upload debug files on failure
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: debug-files
          path: |
            debug.png
            error.html
